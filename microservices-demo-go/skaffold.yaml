apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  - image: emailservice
    context: src/emailservice
    # Single pre-build hook vendors all services via run_vendor.sh / run_vendor.bat.
    # Skaffold runs hooks once before any artifact build; we attach to the first
    # artifact for clarity.
    hooks:
      before:
        - command: ["cmd", "/C", "run_vendor.bat"]
          os: [windows]
        - command: ["sh", "-c", "./run_vendor.sh"]
          os: [darwin, linux]
  - image: productcatalogservice
    context: src/productcatalogservice
  - image: recommendationservice
    context: src/recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
  - image: shippingservice
    context: src/shippingservice
  - image: checkoutservice
    context: src/checkoutservice
  - image: paymentservice
    context: src/paymentservice
  - image: currencyservice
    context: src/currencyservice
  - image: cartservice
    context: src/cartservice/src
    docker:
      dockerfile: Dockerfile
  - image: frontend
    context: src/frontend
  - image: adservice
    context: src/adservice
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
manifests:
  kustomize:
    paths:
    - kubernetes-manifests
deploy:
  kubectl: {}
