apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      serviceAccountName: shoppingassistantservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: shoppingassistantservice
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        # PROJECT_ID is required by the service even in mock mode (the binary
        # fails fast if it's empty). Override at deploy time when wiring AlloyDB
        # or a real LLM backend; for local/in-cluster demo runs, leave as a
        # placeholder — DB_BACKEND and LLM_BACKEND are unset so the service
        # uses its built-in mock stores.
        - name: PROJECT_ID
          value: "local-demo"
        - name: COLLECTOR_SERVICE_ADDR
          value: "otel-collector:4317"
        - name: MANTEION_URL
          value: "http://host.minikube.internal:9090"
        - name: MANTEION_SERVICE_VERSION
          value: "1.0.0"
        readinessProbe:
          initialDelaySeconds: 15
          httpGet:
            path: /_healthz
            port: 8080
        livenessProbe:
          initialDelaySeconds: 20
          httpGet:
            path: /_healthz
            port: 8080
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  selector:
    app: shoppingassistantservice
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoppingassistantservice
