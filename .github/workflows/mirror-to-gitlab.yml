name: Mirror to GitLab

on:
  push:
    branches: [main, develop]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # If you had a 'test' job here, it would run every time.
  
  mirror:
    runs-on: ubuntu-latest
    # This 'if' ensures the mirror ONLY runs if the commit is "fresh" 
    # and not one that just arrived from a GitLab sync.
    if: |
      github.actor != 'gitlab-mirror-bot' && 
      !contains(github.event.head_commit.message, 'Gitlab github sync')
    
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@git.ucsc.edu/microfaults/service-beds.git"
          BRANCH_NAME="${{ github.ref_name }}"
          
          # We do NOT use -o ci.skip so GitLab CI (AI Review) runs.
          # The GitLab mirror job's 'rules' will prevent it from pushing back.
          git push gitlab "refs/heads/$BRANCH_NAME:refs/heads/$BRANCH_NAME" --force
          
          echo "✅ Mirrored to GitLab. AI Review will trigger."